name: CI
on:
  pull_request:
  push: 
    branches: [ "3.x" ]
  schedule:
    - cron:  '0 0 * * *'
jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php-versions }}) (SF ${{ matrix.sf-version }}) (${{ matrix.composer }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sf-version: ["*"]
        php-versions: ['8.1', '8.2', '8.3', '8.4', '8.5']
        composer: [ "lowest", "highest" ]
        include:
          - sf-version: "5.4.*"
            php-versions: '8.3'
            composer: 'highest'
          - sf-version: "6.4.*"
            php-versions: '8.3'
            composer: 'highest'
          - sf-version: "7.4.*"
            php-versions: '8.3'
            composer: 'highest'
          - sf-version: "8.1.*"
            php-versions: '8.4'
            composer: 'highest'
          - sf-version: "8.*"
            php-versions: '8.4'
            composer: 'highest'
            roadrunner: '3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-versions }}'
          extensions: mbstring,intl,mongodb
          tools: composer:v2,flex
      - name: Require RoadRunner 3
        if: matrix.roadrunner == '3'
        run: |
          composer require --no-update "spiral/roadrunner:^3.0"
          # GHSA-g9pc-8g42-g6vq's "< 2025.1.0" range also matches 3.0.0, see github/advisory-database#10283
          composer config audit.ignore --json '["GHSA-g9pc-8g42-g6vq"]'
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.composer }}
        env:
          SYMFONY_REQUIRE: ${{ matrix.sf-version }}
      - name: PHPUnit
        run: composer test

  static-analysis:
    name: Static analysis (PHP ${{ matrix.php-versions }}) (${{ matrix.composer }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.1', '8.2', '8.3', '8.4']
        composer: ["lowest", "highest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php-versions }}'
          extensions: mbstring,intl,mongodb
          tools: composer:v2
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.composer }}
      - name: Install tools
        uses: ramsey/composer-install@v3
        with:
          working-directory: tools
      - name: PHPStan
        run: composer phpstan

  coding-style:
    name: Coding style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,intl,mongodb
          tools: composer:v2
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: tools
      - name: PHP CS Fixer
        run: composer cs:lint
